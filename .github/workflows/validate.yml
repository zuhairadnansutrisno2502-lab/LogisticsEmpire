name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rojo project parses
        run: python3 -m json.tool default.project.json > /dev/null
      - name: Install Lune 0.10.5 (same as rokit.toml, checksum pinned)
        run: |
          curl -fsSL -o lune.zip https://github.com/lune-org/lune/releases/download/v0.10.5/lune-0.10.5-linux-x86_64.zip
          echo "1fb5dee6a1afa1d300092805c6e660fe06144d29dd68c45cf6956f040667f791  lune.zip" | sha256sum -c -
          unzip -q lune.zip -d "$RUNNER_TEMP/lune" && echo "$RUNNER_TEMP/lune" >> "$GITHUB_PATH"
      - name: Luau tests
        run: for t in tests/*.spec.luau; do lune run "$t"; done
